name: update stats

on:
  schedule:
    - cron: "23 4 * * *" # daily, off the busy minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: regenerate stats svgs
        run: python3 scripts/gen_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}

      - name: commit if changed
        run: |
          git config user.name "h00die-stats-bot"
          git config user.email "actions@github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "no stat changes today"
            exit 0
          fi
          git commit -m "chore: regenerate profile stats"
          git push
